<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LuxeSalon">
  <title>LuxeSalon — Luxury Booking & Management</title>
  
  <style>
    :root {
      --bg: #0a0a12;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #a855f7;
      --secondary: #ec4899;
      --accent: #3b82f6;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 16px;
      box-sizing: border-box;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }

    /* Synthetic Wave Canvas Background */
    #waveCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.75;
    }

    /* Main Container */
    #app {
      position: relative;
      z-index: 1;
      max-width: 620px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    /* Typography & Headers */
    .brand-subtitle {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.15;
      background: linear-gradient(135deg, #ffffff 30%, var(--primary) 70%, var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 18px;
      font-weight: 700;
      margin: 22px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    p.subtext {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
    }

    /* Glassmorphic Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      animation: fadeInUp 0.4s ease-out;
    }

    .card.clickable {
      cursor: pointer;
    }

    .card.clickable:hover, .card.clickable:active {
      border-color: var(--primary);
      transform: translateY(-2px);
      background: rgba(168, 85, 247, 0.08);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Layout Helpers */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .row-wrap {
      flex-wrap: wrap;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Form Controls */
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-field {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.3);
      color: var(--text);
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
    }

    select.input-field option {
      background: #12121f;
      color: #fff;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, var(--primary), var(--secondary));
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(168, 85, 247, 0.35);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.98);
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.2);
    }

    .btn-secondary {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      box-shadow: none;
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #25d366, #128c7e);
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.3);
    }

    .btn-sm {
      width: auto;
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 8px;
      box-shadow: none;
    }

    .btn-danger { background: var(--danger); }
    .btn-success { background: var(--success); }

    /* Horizontal Scroll Chips */
    .chip-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }

    .chip-scroll::-webkit-scrollbar { display: none; }

    .chip {
      flex: none;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .chip.selected {
      background: linear-gradient(135deg, #7c3aed, var(--primary));
      border-color: transparent;
      color: #fff;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(168, 85, 247, 0.4);
    }

    .chip.disabled {
      opacity: 0.3;
      text-decoration: line-through;
      pointer-events: none;
    }

    /* Slots Grid */
    .time-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 4px;
      margin: 16px 0;
    }

    .nav-tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .nav-tab.active {
      background: linear-gradient(135deg, #7c3aed, var(--primary));
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
    }

    /* Status Badges */
    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-pending { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-confirmed { background: rgba(168, 85, 247, 0.2); color: var(--primary); border: 1px solid rgba(168, 85, 247, 0.4); }
    .badge-done { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-cancelled, .badge-noshow { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.4); }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-content {
      background: #121220;
      border: 1px solid var(--card-border);
      border-radius: 24px 24px 0 0;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
      width: 100%;
      max-width: 620px;
      max-height: 88vh;
      overflow-y: auto;
      animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #1e1e30;
      border: 1px solid var(--primary);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .footer-link {
      text-align: center;
      margin-top: 32px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Dynamic Wave Background -->
  <canvas id="waveCanvas"></canvas>

  <!-- Root App Container -->
  <div id="app"></div>

  <!-- Global Toast -->
  <div id="toast">Notice</div>

<script>
  // --- UTILITY FUNCTIONS ---
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const formatDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const toMinutes = timeStr => { const [h, m] = timeStr.split(':'); return parseInt(h) * 60 + parseInt(m); };
  const toTimeString = mins => `${pad(Math.floor(mins / 60))}:${pad(mins % 60)}`;
  const format12H = timeStr => {
    let [h, m] = timeStr.split(':');
    h = parseInt(h);
    const ampm = h >= 12 ? 'PM' : 'AM';
    return `${h % 12 || 12}:${m} ${ampm}`;
  };
  const formatLKR = amt => 'LKR ' + Math.round(amt).toLocaleString();
  const escapeHTML = str => String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // --- PERSISTENT STATE MANAGEMENT ---
  const STORAGE_KEY = 'luxe_salon_pwa_v3';
  let DB = null;

  try { DB = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e){}

  if (!DB) {
    DB = {
      passwordHash: null,
      salon: { name: 'Luxe Salon & Spa', whatsapp: '94771234567', openHour: 9, closeHour: 19, bufferMins: 15 },
      services: [
        { id: 1, name: 'Ladies Haircut & Style', price: 2500, duration: 45 },
        { id: 2, name: 'Gents Haircut & Beard', price: 1200, duration: 30 },
        { id: 3, name: 'Hair Wash & Blowdry', price: 1500, duration: 30 },
        { id: 4, name: 'Deep Conditioning Treatment', price: 4500, duration: 60 },
        { id: 5, name: 'Facial & Cleanup', price: 3800, duration: 60 },
        { id: 6, name: 'Keratin Straightening', price: 15000, duration: 180 }
      ],
      staff: [
        { id: 1, name: 'Nadeesha', sharePct: 50 },
        { id: 2, name: 'Kamal', sharePct: 50 },
        { id: 3, name: 'Dilani', sharePct: 50 }
      ],
      appointments: [],
      transactions: [],
      closedDays: []
    };
  }

  const saveDB = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch(e){} };

  // Helper getters
  const getService = id => DB.services.find(s => s.id == id);
  const getStaff = id => DB.staff.find(s => s.id == id);
  const getTodayStr = () => formatDate(new Date());
  const isDayClosed = dateStr => DB.closedDays.some(d => d.date === dateStr);

  // App UI State
  let state = {
    view: location.hash === '#staff' ? 'login' : 'book',
    bookingStep: 1,
    adminTab: 'appts',
    selectedDate: getTodayStr(),
    financeDate: getTodayStr(),
    modal: null,
    loginErr: ''
  };

  let bookingForm = {
    serviceId: null,
    staffId: 'any',
    date: getTodayStr(),
    time: null,
    name: '',
    phone: '',
    note: ''
  };

  let lastConfirmedBooking = null;
  let isAuthenticated = false;

  try { isAuthenticated = sessionStorage.getItem('luxe_auth') === '1'; } catch(e){}

  function showToast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // Slot Availability Engine with Buffer Support
  function checkStaffFree(date, timeStr, duration, staffId) {
    const startMins = toMinutes(timeStr);
    const endMins = startMins + duration + DB.salon.bufferMins;
    const candidates = staffId && staffId !== 'any' ? DB.staff.filter(s => s.id == staffId) : DB.staff;

    return candidates.find(member => {
      const busy = DB.appointments.some(a => {
        if (a.staffId != member.id || a.date !== date || a.status === 'cancelled' || a.status === 'noshow') return false;
        const aSvc = getService(a.serviceId);
        const aStart = toMinutes(a.time);
        const aEnd = aStart + (aSvc ? aSvc.duration : 30) + DB.salon.bufferMins;
        return startMins < aEnd && aStart < endMins;
      });
      return !busy;
    });
  }

  function getAvailableSlots(date, duration, staffId) {
    const slots = [];
    const now = new Date();
    const currentMins = now.getHours() * 60 + now.getMinutes();

    for (let m = DB.salon.openHour * 60; m + duration <= DB.salon.closeHour * 60; m += 30) {
      const timeStr = toTimeString(m);
      const isPast = (date === getTodayStr() && m <= currentMins);
      const availableStaff = !isPast && checkStaffFree(date, timeStr, duration, staffId);
      slots.push({ time: timeStr, available: !!availableStaff });
    }
    return slots;
  }

  // --- RENDER ROUTER ---
  function render() {
    if (state.view === 'admin' && !isAuthenticated) state.view = 'login';
    const app = $('app');
    if (state.view === 'book') app.innerHTML = renderBookingPortal();
    else if (state.view === 'login') app.innerHTML = renderLogin();
    else if (state.view === 'admin') app.innerHTML = renderAdminDashboard();
    window.scrollTo(0, 0);
  }

  // --- PUBLIC BOOKING PORTAL UI ---
  function renderBookingPortal() {
    const salon = DB.salon;
    let html = `
      <div style="padding: 20px 0 10px;">
        <div class="brand-subtitle">✦ ${escapeHTML(salon.name)}</div>
        <h1>Book Appointment</h1>
        <p class="subtext">Select service, stylist & preferred time slot.</p>
      </div>
    `;

    // Step 1: Select Service
    if (state.bookingStep === 1) {
      html += `<h2>1. Select Service</h2>`;
      html += DB.services.map(svc => `
        <div class="card clickable row" onclick="selectService(${svc.id})">
          <div>
            <b style="font-size: 16px;">${escapeHTML(svc.name)}</b>
            <div class="subtext" style="font-size: 12px; margin-top: 2px;">Duration: ${svc.duration} mins</div>
          </div>
          <div style="font-size: 16px; font-weight: 800; color: var(--primary);">${formatLKR(svc.price)}</div>
        </div>
      `).join('');
    }

    // Step 2: Select Stylist, Date & Time Slot
    else if (state.bookingStep === 2) {
      const svc = getService(bookingForm.serviceId);
      const days = [...Array(14)].map((_, i) => {
        const d = new Date(); d.setDate(d.getDate() + i); return d;
      });

      html += `
        <h2>2. Schedule Slot</h2>
        <div class="card" style="margin-bottom: 16px;">
          <b>${escapeHTML(svc.name)}</b>
          <div class="subtext">${svc.duration} mins · ${formatLKR(svc.price)}</div>
        </div>

        <label>Preferred Stylist</label>
        <div class="chip-scroll">
          <div class="chip ${bookingForm.staffId === 'any' ? 'selected' : ''}" onclick="bookingForm.staffId='any'; bookingForm.time=null; render();">Any Stylist</div>
          ${DB.staff.map(st => `
            <div class="chip ${bookingForm.staffId == st.id ? 'selected' : ''}" onclick="bookingForm.staffId=${st.id}; bookingForm.time=null; render();">
              ${escapeHTML(st.name)}
            </div>
          `).join('')}
        </div>

        <label style="margin-top: 14px;">Select Date</label>
        <div class="chip-scroll">
          ${days.map(d => {
            const dStr = formatDate(d);
            const dayName = d.toLocaleDateString('en', { weekday: 'short' });
            return `
              <div class="chip ${bookingForm.date === dStr ? 'selected' : ''}" onclick="bookingForm.date='${dStr}'; bookingForm.time=null; render();">
                <div style="font-size: 10px; text-transform: uppercase;">${dayName}</div>
                <div style="font-size: 16px; font-weight: 800;">${d.getDate()}</div>
              </div>
            `;
          }).join('')}
        </div>

        <label style="margin-top: 14px;">Available Time Slots</label>
        <div class="time-grid">
          ${getAvailableSlots(bookingForm.date, svc.duration, bookingForm.staffId).map(s => `
            <div class="chip ${!s.available ? 'disabled' : ''} ${bookingForm.time === s.time ? 'selected' : ''}" 
                 onclick="bookingForm.time='${s.time}'; render();">
              ${format12H(s.time)}
            </div>
          `).join('')}
        </div>

        <div class="row" style="margin-top: 20px;">
          <button class="btn btn-secondary" style="width: auto;" onclick="state.bookingStep=1; render();">Back</button>
          <button class="btn" onclick="proceedToDetails()">Continue</button>
        </div>
      `;
    }

    // Step 3: Guest Information
    else if (state.bookingStep === 3) {
      const svc = getService(bookingForm.serviceId);
      html += `
        <h2>3. Your Details</h2>
        <div class="card" style="margin-bottom: 16px;">
          <b>${escapeHTML(svc.name)}</b>
          <div class="subtext">${bookingForm.date} at ${format12H(bookingForm.time)} · ${formatLKR(svc.price)}</div>
        </div>

        <label>Your Full Name</label>
        <input class="input-field" id="custName" placeholder="e.g. Kasun Perera" value="${escapeHTML(bookingForm.name)}">

        <label>WhatsApp / Mobile Number</label>
        <input class="input-field" id="custPhone" type="tel" placeholder="e.g. 0771234567" value="${escapeHTML(bookingForm.phone)}">

        <label>Special Instructions / Notes (Optional)</label>
        <input class="input-field" id="custNote" placeholder="Hair length, color preferences..." value="${escapeHTML(bookingForm.note)}">

        <div class="row" style="margin-top: 10px;">
          <button class="btn btn-secondary" style="width: auto;" onclick="state.bookingStep=2; render();">Back</button>
          <button class="btn" onclick="confirmBooking()">Confirm & Reserve</button>
        </div>
      `;
    }

    // Step 4: Booking Confirmation & WhatsApp Action
    else if (state.bookingStep === 4 && lastConfirmedBooking) {
      const svc = getService(lastConfirmedBooking.serviceId);
      const staffMember = getStaff(lastConfirmedBooking.staffId);

      html += `
        <div class="card" style="text-align: center; padding: 28px 16px; margin-top: 20px;">
          <div style="font-size: 50px; margin-bottom: 10px;">✨</div>
          <h2 style="justify-content: center; margin: 0 0 8px;">Booking Requested!</h2>
          <p class="subtext" style="margin-bottom: 16px;">
            Thank you, <b>${escapeHTML(lastConfirmedBooking.name)}</b>!<br>
            We reserved <b>${escapeHTML(svc.name)}</b> on<br>
            <span style="color: var(--text); font-weight: 700;">${lastConfirmedBooking.date} at ${format12H(lastConfirmedBooking.time)}</span>
            ${staffMember ? ` with ${escapeHTML(staffMember.name)}` : ''}.
          </p>
          <button class="btn btn-whatsapp" onclick="sendWhatsAppConfirmation()">
            📱 Send Booking to Salon via WhatsApp
          </button>
          <button class="btn btn-secondary" style="margin-top: 10px;" onclick="resetBookingPortal()">
            Make Another Appointment
          </button>
        </div>
      `;
    }

    html += `<div class="footer-link">Are you staff? <a onclick="state.view='login'; render();">Owner / Staff Login</a></div>`;
    return html;
  }

  function selectService(id) {
    bookingForm.serviceId = id;
    bookingForm.time = null;
    state.bookingStep = 2;
    render();
  }

  function proceedToDetails() {
    if (!bookingForm.time) return showToast('Please select an available time slot.');
    state.bookingStep = 3;
    render();
  }

  function confirmBooking() {
    bookingForm.name = $('custName').value.trim();
    bookingForm.phone = $('custPhone').value.replace(/[\s-]/g, '');
    bookingForm.note = $('custNote').value.trim();

    if (bookingForm.name.length < 2) return showToast('Please enter your full name.');
    if (!/^(\+?94|0)?7\d{8}$/.test(bookingForm.phone)) return showToast('Enter a valid mobile phone number.');

    const svc = getService(bookingForm.serviceId);
    const assignedStaff = checkStaffFree(bookingForm.date, bookingForm.time, svc.duration, bookingForm.staffId);

    if (!assignedStaff) {
      showToast('Selected slot was just booked! Please pick another.');
      state.bookingStep = 2;
      return render();
    }

    lastConfirmedBooking = {
      id: Date.now(),
      name: bookingForm.name,
      phone: bookingForm.phone,
      serviceId: bookingForm.serviceId,
      staffId: assignedStaff.id,
      date: bookingForm.date,
      time: bookingForm.time,
      note: bookingForm.note,
      status: 'pending',
      source: 'online'
    };

    DB.appointments.push(lastConfirmedBooking);
    saveDB();
    state.bookingStep = 4;
    render();
  }

  function sendWhatsAppConfirmation() {
    const svc = getService(lastConfirmedBooking.serviceId);

  // TAB 2: Financial Engine & 50/50 Revenue Splitting
  function calcFinance(dateStr) {
    const summary = { count: 0, gross: 0, discount: 0, tips: 0, ownerShare: 0, staffShare: 0, methods: {}, staffBreakdown: {} };
    const txs = DB.transactions.filter(t => t.date === dateStr);

    txs.forEach(t => {
      const netService = t.amount - t.discount;
      const sShare = netService * (t.sharePct / 100);
      const oShare = netService - sShare;

      summary.count++;
      summary.gross += netService;
      summary.discount += t.discount;
      summary.tips += t.tip;
      summary.ownerShare += oShare;
      summary.staffShare += sShare;

      summary.methods[t.method] = (summary.methods[t.method] || 0) + netService + t.tip;

      if (!summary.staffBreakdown[t.staffId]) {
        summary.staffBreakdown[t.staffId] = { share: 0, tips: 0, count: 0 };
      }
      summary.staffBreakdown[t.staffId].share += sShare;
      summary.staffBreakdown[t.staffId].tips += t.tip;
      summary.staffBreakdown[t.staffId].count++;
    });

    return summary;
  }

      date: state.financeDate,
      totalRevenue: fin.gross,
      ownerTotal: fin.ownerShare,
      staffTotal: fin.staffShare + fin.tips

    const staffId = +$('m_staff').value;

    DB.appointments.push({
      id: Date.now(), name, phone: phone || 'N/A', serviceId, staffId, date, time, note: 'Manual Walk-in', status: 'confirmed', source: 'walkin'

  function processCheckout(apptId) {
    const appt = DB.appointments.find(a => a.id === apptId);
    if (isDayClosed(appt.date)) return showToast('Cannot complete transactions for closed dates.');

    const amount = +$('p_amt').value || 0;
    const discount = +$('p_disc').value || 0;
    const tip = +$('p_tip').value || 0;
    const method = $('p_method').value;

    const st = getStaff(appt.staffId);

    DB.transactions.push({
      id: Date.now(),
      apptId: appt.id,
      date: appt.date,
      staffId: appt.staffId,
      sharePct: st ? st.sharePct : 50,
      amount,
      discount,
      tip,
      method
    });

    appt.status = 'done';
    saveDB();
    state.modal = null;
    render();
    showToast('Payment successfully recorded!');
  }

  // --- SYNTHETIC WAVE CANVAS ANIMATION ENGINE ---
  const canvas = $('waveCanvas');
  const ctx = canvas.getContext('2d');
  let width, height, time = 0;

  function resizeCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function animateWaves() {
    ctx.clearRect(0, 0, width, height);
    time += 0.003;

    const waves = [
      { color: '#7c3aed', alpha: 0.12, speed: 0.003, amplitude: 70, offset: 0, heightRatio: 0.4 },
      { color: '#a855f7', alpha: 0.09, speed: 0.004, amplitude: 55, offset: 2, heightRatio: 0.6 },
      { color: '#ec4899', alpha: 0.07, speed: 0.002, amplitude: 65, offset: 4, heightRatio: 0.8 }
    ];

    waves.forEach(w => {
      ctx.beginPath();
      ctx.moveTo(0, height);
      for (let x = 0; x <= width; x += 8) {
        const y = height * w.heightRatio + 
                  Math.sin(x * w.speed + time + w.offset) * w.amplitude + 
                  Math.sin(x * w.speed * 2 + time) * (w.amplitude * 0.3);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(width, height);
      ctx.fillStyle = w.color;
      ctx.globalAlpha = w.alpha;
      ctx.fill();
    });

    ctx.globalAlpha = 1;
    requestAnimationFrame(animateWaves);
  }

  // Init App
  (async () => {
    if (!DB.passwordHash) DB.passwordHash = await sha256('salon123');
    saveDB();
